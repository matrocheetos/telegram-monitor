services:
  telegram-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-monitor:latest
    container_name: telegram-monitor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_SECRET_KEY=${APP_SECRET_KEY:-default-development-secret-key-32-bytes}
      - DB_PATH=/app/data/telegram-monitor.db
      - HTTP_PORT=8080
      - APPRISE_URL=${APPRISE_URL:-http://apprise:8000}
      - APPRISE_KEY=${APPRISE_KEY:-}
      - NTFY_URL=${NTFY_URL:-https://ntfy.sh}
      - NTFY_TOPIC_SEPARATOR=-
      - NTFY_TOPIC_PREFIX=${NTFY_TOPIC_PREFIX:-test-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8787,https://promos.matrochares.qzz.io}
      - GOMEMLIMIT=128MiB
