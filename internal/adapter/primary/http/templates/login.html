{{define "content"}}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <span class="badge badge-primary">{{.T "login_badge"}}</span>
      <h1 class="auth-title">{{.T "login_title"}}</h1>
      <p class="auth-subtitle">{{.T "login_subtitle"}}</p>
    </div>

    <form action="/login" method="POST">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

      <div class="form-group">
        <label for="username" class="form-label">{{.T "login_username_label"}}</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="{{.T "login_username_placeholder"}}" required autofocus>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">{{.T "login_password_label"}}</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        {{.T "login_submit_btn"}}
      </button>
    </form>

    <div class="auth-footer">
      <p>{{.T "login_note1"}}</p>
      <p style="margin-top: 4px; font-weight: 500;">{{.T "login_note2"}}</p>
    </div>
  </div>
</div>
{{end}}
