{{define "content"}}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <span class="badge badge-primary">{{.T "setup_step_badge"}}</span>
      <h1 class="auth-title">{{.T "setup_title"}}</h1>
      <p class="auth-subtitle">{{.T "setup_subtitle"}}</p>
    </div>

    <form action="/setup" method="POST">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

      <div class="form-group">
        <label for="username" class="form-label">{{.T "setup_username_label"}}</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="{{.T "setup_username_placeholder"}}" required autofocus pattern="^[a-zA-Z0-9_.-]{3,32}$">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">{{.T "setup_password_label"}}</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••" required minlength="8">
      </div>

      <div class="form-group">
        <label for="password_confirm" class="form-label">{{.T "setup_password_confirm_label"}}</label>
        <input type="password" id="password_confirm" name="password_confirm" class="form-control" placeholder="••••••••••••" required minlength="8">
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        {{.T "setup_submit_btn"}}
      </button>
    </form>

    <div class="auth-footer">
      <p>{{.T "setup_note1"}}</p>
      <p style="margin-top: 4px; font-weight: 500;">{{.T "setup_note2"}}</p>
    </div>
  </div>
</div>
{{end}}
