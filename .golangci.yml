run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - staticcheck
    - unused
    - errcheck
    - errorlint
    - nilerr
    - forcetypeassert
    - copyloopvar
    - gocritic
    - revive
    - misspell
    - predeclared
    - errname
    - ineffassign
    - gosec
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck
    - sloglint
    - nolintlint

linters-settings:
  errcheck:
    check-type-assertions: true
  nolintlint:
    require-explanation: true
    require-specific: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 50
